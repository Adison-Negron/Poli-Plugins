# Generated by generate_skin.py -- edit the numbers there, not here.
# Coordinates: x = screen x, y = screen y + 86 (shadow_skin Y_OFF). Plugin area 1280x628.
theme_bg=FFFFFF
theme_ink=644D3F
theme_ink_dim=8A7466
theme_accent=644D3F

[tab POLI-ESSER]
art file=skin_assets/bg.png fit=stretch

# 4x2 knob grid: labels are baked into bg.png, so no MPC name/value text (ns=0 vs=0)
knob cx=152 cy=331 r=75 label="" key=intensity ns=0 vs=0 bw=158 strip=skin_assets/knob_strip.png frames=63
knob cx=331 cy=331 r=75 label="" key=thresh ns=0 vs=0 bw=158 strip=skin_assets/knob_strip.png frames=63
knob cx=511 cy=331 r=75 label="" key=freq ns=0 vs=0 bw=158 strip=skin_assets/knob_strip.png frames=63
# Diff OFF/ON: tap (or turn its Q-Link) to flip; drawn as the same knob at min / max
toggle cx=690 cy=331 label="" key=diff ns=0 w=158 h=158 img=skin_assets/diff_off.png img_on=skin_assets/diff_on.png
knob cx=152 cy=553 r=75 label="" key=attack ns=0 vs=0 bw=158 strip=skin_assets/knob_strip.png frames=63
knob cx=331 cy=553 r=75 label="" key=release ns=0 vs=0 bw=158 strip=skin_assets/knob_strip.png frames=63
knob cx=511 cy=553 r=75 label="" key=knee ns=0 vs=0 bw=158 strip=skin_assets/knob_strip.png frames=63
knob cx=690 cy=553 r=75 label="" key=mix ns=0 vs=0 bw=158 strip=skin_assets/knob_strip.png frames=63

# gain-reduction meter: display only, the engine drives it (HAS_DISPLAY_REV)
meter cx=983 cy=460 w=144 h=364 key=meter strip=skin_assets/meter_strip.png frames=32


